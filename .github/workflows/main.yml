name: Next.js Production Check

on:
  push:
    branches: [ "main" ]  # Solo cuando llega a la rama estable

jobs:
  validate_production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci  # npm ci es más rápido y estricto para producción
      - name: Production Build
        run: npm run build